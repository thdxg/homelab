# Public, read-only network-flow UI. hubble-ui's service account is
# limited to get/list/watch on namespaces, nodes, pods, services and
# CRDs — it exposes cluster topology and flows, never credentials or
# any mutating action. Cilium (and therefore hubble-ui) is installed by
# bootstrap, so only the route is managed here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking
  hostnames:
    - "hubble.thdxg.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
