apiVersion: v1
kind: ServiceAccount
metadata:
  name: me
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: me
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: me
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: me-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: me
type: kubernetes.io/service-account-token
