[tasks.apparmor]
description = "Disable restrictive cri-containerd AppArmor profile"
run = """
{% for node in ["node-1", "node-2"] %}
ssh {{ node }} -- bash -s << EOF
sudo mkdir -p /var/lib/rancher/k3s/agent/etc/containerd
sudo tee /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl > /dev/null << 'TOML'
version = 2
[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
  runtime_type = "io.containerd.runc.v2"
[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
  SystemdCgroup = true
  AppArmorProfile = "unconfined"
TOML
sudo rm -f /etc/apparmor.d/disable/cri-containerd.apparmor.d
sudo tee /etc/apparmor.d/cri-containerd.apparmor.d > /dev/null << 'PROFILE'
abi <abi/4.0>,
include <tunables/global>
profile cri-containerd.apparmor.d flags=(unconfined) {
  userns,
}
PROFILE
sudo apparmor_parser -r /etc/apparmor.d/cri-containerd.apparmor.d
EOF
{% endfor %}
"""

[tasks.eth0]
description = "Assign static IPs on the ethernet interface"
run = """
{% for node in ["node-1", "node-2"] %}
ssh {{ node }} bash -s << EOF
sudo tee /etc/netplan/99-eth0-static.yaml > /dev/null << 'YAML'
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - {{ env["NODE_" ~ loop.index ~ "_IP_ETH"] }}/30
YAML
sudo chmod 600 /etc/netplan/99-eth0-static.yaml
sudo ip link set eth0 up
sudo netplan apply
EOF
{% endfor %}
"""

[tasks.cilium-link]
description = "Stop udev rewriting MACs on cilium's virtual interfaces"
run = """
{% for node in ["node-1", "node-2"] %}
ssh {{ node }} bash -s << 'EOF'
# systemd's default MACAddressPolicy=persistent races cilium's interface
# setup (documented cilium/systemd >=245 incompatibility): udev rewrites
# veth/vxlan MACs after the agent configures them, nondeterministically
# breaking the datapath depending on creation order.
sudo tee /etc/systemd/network/50-cilium-unmanaged.link > /dev/null << 'LINK'
[Match]
Driver=veth vxlan
[Link]
MACAddressPolicy=none
LINK
sudo udevadm control --reload
EOF
{% endfor %}
"""

[tasks.wifi]
description = "Configure wifi on both nodes (SSID/password from env)"
run = """
{% for node in ["node-1", "node-2"] %}
ssh {{ node }} bash -s << EOF
sudo tee /etc/netplan/99-wifi.yaml > /dev/null << 'YAML'
network:
  version: 2
  wifis:
    wlan0:
      dhcp4: true
      access-points:
        "{{ env.WIFI_SSID }}":
          password: "{{ env.WIFI_PASSWORD }}"
YAML
sudo chmod 600 /etc/netplan/99-wifi.yaml
sudo netplan apply
EOF
{% endfor %}
"""

[tasks.cilium-accept-local]
description = "Let cilium proxy traffic through the kernel source check (Tailscale sets src_valid_mark=1)"
run = """
{% for node in ["node-1", "node-2"] %}
ssh {{ node }} bash -s << 'EOF'
# Tailscale >= 1.98 (netfilter-mode=on) sets net.ipv4.conf.all.src_valid_mark=1
# globally, so the kernel includes the fwmark in reverse-path source
# validation. Cilium marks proxy-bound packets 0x200 and routes that mark to
# table 2004 (local default dev lo), so a same-node backend's reply to a
# cilium-envoy upstream socket resolves as RTN_LOCAL on ingress via the pod
# veth, and with accept_local=0 the stack drops it as IP_LOCAL_SOURCE — no
# cilium drop counter fires. cilium/cilium#47940, #47591, #48706.
# Same glob mechanism cilium's own 99-zzz-override_cilium.conf uses for
# rp_filter: systemd-sysctl applies it at boot and udev (99-systemd.rules)
# re-applies it to each new lxc* veth as it appears.
sudo tee /etc/sysctl.d/90-cilium-accept-local.conf > /dev/null << 'CONF'
# Accept RTN_LOCAL-classified sources on cilium pod veths. Needed because
# Tailscale sets net.ipv4.conf.all.src_valid_mark=1 and cilium's 0x200 proxy
# mark then makes same-node proxy replies look local (cilium/cilium#48706).
# Spoofing protection for pod traffic is enforced in BPF, not by this check.
-net.ipv4.conf.lxc*.accept_local = 1
# The same check also martian-drops EXTERNAL clients of a cilium-envoy
# listener (L7LB NodePort or gatewayAPI.hostNetwork) on the ingress device:
# the listener socket is transparent, the SYN gets mark 0x200, and the client
# source then resolves RTN_LOCAL (cilium/cilium#46260). Verified 2026-10-30:
# 0/20 without, 20/20 with, on both devices and both gateway modes. Trade-off
# accepted 2026-10-30: the host accepts packets whose source is one of its own
# addresses on these NICs; rp_filter stays at its loose default (2).
net.ipv4.conf.wlan0.accept_local = 1
net.ipv4.conf.eth0.accept_local = 1
CONF
# Apply to veths that already exist; new ones get it from udev.
sudo /usr/lib/systemd/systemd-sysctl /etc/sysctl.d/90-cilium-accept-local.conf
for d in /proc/sys/net/ipv4/conf/lxc* /proc/sys/net/ipv4/conf/wlan0 /proc/sys/net/ipv4/conf/eth0; do
  echo "$(hostname) $(basename "$d") accept_local=$(cat "$d/accept_local")"
done
EOF
{% endfor %}
"""
