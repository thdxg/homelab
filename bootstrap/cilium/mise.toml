[tasks.install]
description = "Install or upgrade Cilium and the Gateway API CRDs"
run = """
# Gateway API CRDs pinned to v1.5.1: cilium 1.20.x serves the public edge
# (see values.yaml) and needs v1 for GatewayClass, Gateway, HTTPRoute,
# GRPCRoute, TLSRoute, ReferenceGrant and BackendTLSPolicy; v1.5.1 serves v1
# for all seven, so it is sufficient. (Envoy Gateway, which first set this
# pin, was removed 2026-10-30.) Bump only together with a cilium upgrade that
# calls for it.
# Never use the unpinned "latest" URL — CRD skew causes subtle breakage.
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/experimental-install.yaml

# One body for both paths: cilium-cli rejects `install` over an existing
# release and `upgrade` when there is nothing to upgrade.
if helm status cilium -n kube-system > /dev/null 2>&1; then
  verb=upgrade
else
  verb=install
fi

echo "==> cilium $verb"
cilium "$verb" --version 1.20.1 \
  --values values.yaml \
  --set k8sServiceHost={{ env.NODE_1_IP_ETH }} \
  --set k8sServicePort=6443 \
  --set ipv4NativeRoutingCIDR={{ env.CLUSTER_CIDR }}
cilium status --wait
"""

[tasks.test]
description = "Test Cilium connectivity"
run = """
cilium connectivity test --test-concurrency 5
kubectl delete namespace cilium-test-1 cilium-test-ccnp1 cilium-test-ccnp2
"""
