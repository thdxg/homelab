[tasks.install]
description = "Install Cilium Gateway API CRDs"
run = """
# Pinned: cilium 1.19 is written against Gateway API v1.3. Unpinned
# "latest" CRDs (v1.5.1 landed here) skew the operator's translation and
# broke same-node upstream reply steering — reproduced clean on kind
# with v1.3.0, broken on the cluster with v1.5.1.
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/experimental-install.yaml
cilium install --version 1.19.6 \
  --values values.yaml \
  --set k8sServiceHost={{ env.NODE_1_IP_ETH }} \
  --set k8sServicePort=6443 \
  --set ipv4NativeRoutingCIDR={{ env.CLUSTER_CIDR }}
cilium status --wait
"""

[tasks.test]
description = "Test Cilium connectivity"
run = """
cilium connectivity test --test-concurrency 5
kubectl delete namespace cilium-test-1 cilium-test-ccnp1 cilium-test-ccnp2
"""
