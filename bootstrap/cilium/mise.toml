[tasks.install]
description = "Install Cilium Gateway API CRDs"
run = """
# Pinned to the Gateway API version cilium's controller is written
# against (1.20 → v1.6.1). Never use the unpinned "latest" URL — CRD
# skew against the controller causes subtle datapath breakage.
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml
cilium install --version 1.20.0 \
  --values values.yaml \
  --set k8sServiceHost={{ env.NODE_1_IP_ETH }} \
  --set k8sServicePort=6443 \
  --set ipv4NativeRoutingCIDR={{ env.CLUSTER_CIDR }}
cilium status --wait
"""

[tasks.test]
description = "Test Cilium connectivity"
run = """
cilium connectivity test --test-concurrency 5
kubectl delete namespace cilium-test-1 cilium-test-ccnp1 cilium-test-ccnp2
"""
