# Cilium helm values. Env-dependent settings (k8sServiceHost,
# ipv4NativeRoutingCIDR) are passed as --set flags by the mise task.
#
# Cilium serves the public edge: gatewayAPI + l7Proxy + the cilium-envoy
# DaemonSet are ON, in hostNetwork mode, so cilium-envoy binds the public
# Gateway's listener ports (80/443) directly on every node and the router's
# same-port forward to node-1 (failover: node-2) lands on it. Replaced Envoy
# Gateway on 2026-10-30 (removed from the repo the same day) — see
# apps/networking/README.md.
#
# HARD PREREQUISITE: `mise run "//bootstrap/os:cilium-accept-local"` on every
# node BEFORE enabling any of this. Tailscale (>=1.98, netfilter-mode=on) sets
# net.ipv4.conf.all.src_valid_mark=1 globally; cilium marks proxy traffic 0x200
# and routes that mark to table 2004 (local default dev lo); with the mark in
# the reverse-path lookup the kernel classifies the peer as RTN_LOCAL and
# martian-drops it on any device with accept_local=0 — same-node backend
# replies on lxc* (cilium/cilium#47940, #48706) and external clients on
# wlan0/eth0 (#46260). No cilium drop counter fires; `log_martians=1` shows
# it. Measured 2026-10-30, 20 requests/node: 0/20 without the drop-in, 20/20
# with it, in both gateway modes. No upstream fix yet (cilium PR #48928 closed
# on process grounds, Tailscale PR #19860 a draft).
#
# Every `cilium:install` run restarts cilium-envoy (envoy.rollOutPods) and so
# blips the HTTP edge for ~1 min, not just the datapath — batch values changes.
# cilium-cli `upgrade` REUSES release values: spell every flag out here.

# Restart pods when config changes — without these, helm upgrades only
# update the ConfigMap and running components keep stale config.
rollOutCiliumPods: true
kubeProxyReplacement: true
ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true
routingMode: tunnel
tunnelProtocol: vxlan
devices:
  - eth0
  - wlan0
bpf:
  masquerade: true
  tproxy: false
autoDirectNodeRoutes: false
operator:
  replicas: 1
  rollOutPods: true
cni:
  exclusive: true
# Needs Gateway API CRDs serving v1 for GatewayClass, Gateway, HTTPRoute,
# GRPCRoute, TLSRoute, ReferenceGrant and BackendTLSPolicy (RequiredGVKs in
# operator/pkg/gateway-api/helpers/schemes.go). The v1.5.1 bundle pinned in
# mise.toml serves v1 for all seven; bump it only with a cilium upgrade that
# requires it.
gatewayAPI:
  enabled: true
  # Advertise h2 via ALPN on the HTTPS listener (Cloudflare -> origin hop).
  enableAlpn: true
  # Listener ports are bound on the host (0.0.0.0) by cilium-envoy instead of
  # going through a LoadBalancer/NodePort Service, which could not pin 80/443.
  hostNetwork:
    enabled: true
  # apps/networking/manifests/gatewayclass.yaml declares the GatewayClass so it
  # survives CRD reinstalls, which makes Flux its owner. At the 'auto' default
  # helm also tries to create and own it, and the upgrade dies on "cannot be
  # imported into the current release".
  gatewayClass:
    create: false
nodePort:
  # Cilium's cgroup post_bind hook refuses host sockets on ports that are live
  # NodePort frontends. Disabled during the Envoy Gateway -> cilium migration
  # (2026-10-30), when cilium-envoy had to bind 80/443 while the old
  # edge-gateway NodePort Service still existed (a NACKed listener is not
  # retried). That Service is gone, so set this back to true at the next
  # routine cilium upgrade — nothing uses NodePorts 80/443 any more.
  bindProtection: false
# L7 proxy ON for the gateway. 1.20.0 livelocked the agent<->envoy xDS channel
# (cilium/cilium#47624) when the last L7 listener drained; fixed by
# cilium/proxy#1982 in the cilium-envoy build 1.20.1 pins (verified here
# 2026-09-10). DO NOT run L7 on 1.20.0. If it ever reappears, envoy.xdsMode:
# split is immune by design (one stream per resource type).
l7Proxy: true
envoy:
  enabled: true
  rollOutPods: true
  # cilium-envoy pods carry no prometheus.io annotations by default; these put
  # them on Alloy's annotated_pods scrape job (job label = cilium-envoy).
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9964"
  securityContext:
    capabilities:
      # Chart default list + NET_BIND_SERVICE, and keep it past the starter's
      # capability drop, so Envoy can bind 80/443 on the host.
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
l2announcements:
  enabled: false
k8sClientRateLimit:
  qps: 50
  burst: 100
# cilium-cli `upgrade` reuses the release's existing values, and `cilium hubble
# enable --ui` once set relay/ui to true there, so `enabled: false` alone fails
# chart validation ("Hubble Relay requires hubble.enabled=true"). Spell all
# three out.
hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
MTU: 1450
