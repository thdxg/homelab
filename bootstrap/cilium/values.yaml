# Cilium helm values. Env-dependent settings (k8sServiceHost,
# ipv4NativeRoutingCIDR) are passed as --set flags by the mise task.
#
# Cilium is CNI-only: gatewayAPI and l7Proxy stay OFF. L7 + TLS live in Envoy
# Gateway (apps/envoy-gateway), whose pod-based data plane needs only plain L4.
#
# 2026-09-10 / 2026-10-30: #47940 is ROOT-CAUSED and WORKED AROUND (see
# bootstrap/os `cilium-accept-local`). cilium-envoy sets IP_TRANSPARENT on
# every upstream socket, so the CILIUM_PRE_mangle rule
#   ! -o lo -m socket --transparent ... -j MARK --set-xmark 0x200
# marks the SYN-ACK coming back from a SAME-NODE backend. That mark alone is
# harmless, but Tailscale (>=1.98, netfilter-mode=on) sets
# net.ipv4.conf.all.src_valid_mark=1 globally, so the kernel's reverse-path
# source check includes the mark, resolves it via ip rule 9 -> table 2004
# (local default dev lo) as RTN_LOCAL, and with accept_local=0 on the pod veth
# drops the packet as IP_LOCAL_SOURCE in ip_rcv_finish_core. No cilium drop
# counter fires. Same bug as cilium/cilium#47591 and #48706.
# Measured 2026-10-30, 20 requests per node, one backend per node:
#   lxc*.accept_local=0 -> same-node 0, remote 10, fail 10 (both nodes)
#   lxc*.accept_local=1 -> same-node 10/9, remote 10/11, fail 0
#   back to 0 -> fails again. The drop-in persists via sysctl.d + udev.
# No upstream fix yet (cilium PR #48928 closed on process grounds, Tailscale
# PR #19860 still a draft).
# The "wlan0 L7 ingress is broken" symptom was the SAME bug on the ingress
# device (cilium/cilium#46260): the external SYN to a transparent cilium-envoy
# listener gets mark 0x200 and the client source is martian-dropped on
# wlan0/eth0 (kernel log: "martian source ... dev=wlan0"). With accept_local=1
# on wlan0+eth0 as well, both the L7LB NodePort path and
# gatewayAPI.hostNetwork went 0/20 -> 20/20 over wlan0 and eth0 (2026-10-30).
# Both flags stay OFF because Envoy Gateway is the serving path, not because
# the cilium gateway is broken any more. Trial config: gatewayAPI.enabled +
# l7Proxy + envoy.enabled true (+ gatewayAPI.hostNetwork.enabled to bind
# listener ports on the host), with `os:cilium-accept-local` applied first.

# Restart pods when config changes — without these, helm upgrades only
# update the ConfigMap and running components keep stale config.
rollOutCiliumPods: true
kubeProxyReplacement: true
ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true
routingMode: tunnel
tunnelProtocol: vxlan
devices:
  - eth0
  - wlan0
bpf:
  masquerade: true
  tproxy: false
autoDirectNodeRoutes: false
operator:
  replicas: 1
  rollOutPods: true
cni:
  exclusive: true
# When enabled, this needs Gateway API CRDs serving v1 for GatewayClass,
# Gateway, HTTPRoute, GRPCRoute, TLSRoute, ReferenceGrant and BackendTLSPolicy
# (RequiredGVKs in operator/pkg/gateway-api/helpers/schemes.go). The v1.5.1
# bundle pinned in mise.toml serves v1 for all seven, so no CRD bump is needed
# and Envoy Gateway keeps the CRD version it is compiled against.
gatewayAPI:
  enabled: false
  # Spelled out because cilium-cli upgrade reuses release values: the
  # 2026-10-30 hostNetwork trial left this true in the release otherwise.
  hostNetwork:
    enabled: false
  # Kept for when this is next flipped on: apps/networking/manifests/
  # gatewayclass.yaml declares the GatewayClass so it survives CRD reinstalls,
  # which makes Flux its owner. At the 'auto' default helm also tries to create
  # and own it, and the upgrade dies on "cannot be imported into the current
  # release".
  gatewayClass:
    create: false
# L7 proxy OFF. Nothing here uses it — no CiliumEnvoyConfigs, no L7/toFQDNs
# policies, no cilium gateway. Note 1.20.0 also livelocks the agent↔envoy xDS
# channel (cilium/cilium#47624): when the last L7 listener drains, envoy
# tears down its NPDS map but keeps the ADS subscription, so the agent
# pushes cilium.NetworkPolicy forever at ~3200/sec, burning a core per node.
# Fixed by cilium/proxy#1982 ("keep ADS policy maps alive", commit 0b027bac),
# shipped to the v1.20 branch in cilium/cilium#47899 and present in the
# cilium-envoy build that 1.20.1 pins (766ccfb3 — verified an ancestor;
# 1.20.0's 7cffc778 is not) — verified fixed on this cluster 2026-09-10 by
# draining the last L7 listener: 0 xDS spins, CPU flat. DO NOT run L7 on 1.20.0.
# If the livelock ever reappears, envoy.xdsMode: split is immune by design —
# each resource type gets its own stream, so dropping a watcher closes it.
l7Proxy: false
envoy:
  enabled: false
  rollOutPods: true
l2announcements:
  enabled: false
k8sClientRateLimit:
  qps: 50
  burst: 100
# cilium-cli `upgrade` reuses the release's existing values, and `cilium hubble
# enable --ui` once set relay/ui to true there, so `enabled: false` alone fails
# chart validation ("Hubble Relay requires hubble.enabled=true"). Spell all
# three out.
hubble:
  enabled: false
  relay:
    enabled: false
  ui:
    enabled: false
MTU: 1450
