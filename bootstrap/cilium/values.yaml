# Cilium helm values. Env-dependent settings (k8sServiceHost,
# ipv4NativeRoutingCIDR) are passed as --set flags by the mise task.
#
# Cilium is CNI-only here: gatewayAPI stays OFF. Its L7 machinery is
# unreliable on this platform (Envoy upstream replies from same-node
# backends are lost nondeterministically — cilium/cilium#47940, plus the
# wlan0 L7 frontend drops in #47400/#26584). L7 + TLS live in Envoy
# Gateway (apps/envoy-gateway), whose pod-based data plane only needs
# plain L4 — which this datapath has never failed to deliver.

# Restart pods when config changes — without these, helm upgrades only
# update the ConfigMap and running components keep stale config.
rollOutCiliumPods: true
kubeProxyReplacement: true
ipam:
  mode: kubernetes
k8s:
  requireIPv4PodCIDR: true
routingMode: tunnel
tunnelProtocol: vxlan
devices:
  - eth0
  - wlan0
bpf:
  masquerade: true
autoDirectNodeRoutes: false
operator:
  replicas: 1
  rollOutPods: true
cni:
  exclusive: true
gatewayAPI:
  enabled: false
envoy:
  rollOutPods: true
l2announcements:
  enabled: false
k8sClientRateLimit:
  qps: 50
  burst: 100
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
MTU: 1450
