# Cluster-scoped read access for the public read-only dashboard —
# `view` only covers namespaced resources. Deliberately excludes
# anything secret-bearing; RBAC has no deny, so keep this list explicit.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # CRDs are never covered by the built-in `view` role, so the operator
  # CRs this cluster runs on need explicit reads. Wildcard *resources*
  # is fine here because these groups hold no credential-bearing kinds —
  # never add a wildcard for the core ("") group, which contains Secrets.
  - apiGroups:
      - "gateway.networking.k8s.io"
      - "gateway.envoyproxy.io"
      - "cilium.io"
      - "cert-manager.io"
      - "acme.cert-manager.io"
      - "source.toolkit.fluxcd.io"
      - "kustomize.toolkit.fluxcd.io"
      - "helm.toolkit.fluxcd.io"
      - "notification.toolkit.fluxcd.io"
      - "image.toolkit.fluxcd.io"
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
