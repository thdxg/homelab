apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 5m
  install:
    createNamespace: true
  chart:
    spec:
      chart: headlamp
      version: 0.44.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    # Read-only: the chart's default binds the SA to cluster-admin, and
    # unsafeUseServiceAccountToken hands that SA to every visitor. The
    # dashboard is public (httproute), so the SA gets `view` (namespaced
    # reads, excludes Secrets) plus the cluster-scoped read supplement in
    # rbac-read.yaml.
    clusterRoleBinding:
      clusterRoleName: view
    config:
      pluginsDir: /build/plugins
      unsafeUseServiceAccountToken: true
    initContainers:
      - command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        imagePullPolicy: Always
        name: headlamp-plugins
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - mountPath: /build/plugins
            name: headlamp-plugins
    # No PVC: the volumes override below replaces the chart's PVC-backed
    # volume with an emptyDir, so a PVC would never get a consumer and
    # local-path's WaitForFirstConsumer binding leaves it Pending forever
    # (which fails the helm install wait).
    persistentVolumeClaim:
      enabled: false
    volumeMounts:
      - mountPath: /build/plugins
        name: headlamp-plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}
