apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking
    # Cilium-served edge (migration from Envoy Gateway); the envoy controller
    # ignores this parent and cilium ignores the one above.
    - name: public-gateway-cilium
      namespace: networking
  hostnames:
    - "headlamp.thdxg.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
