apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: flux@thdxg.dev
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      # DNS-01 is required for wildcard certificates: proof of domain
      # ownership happens via a TXT record, so no inbound HTTP needed.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
