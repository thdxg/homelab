apiVersion: apps/v1
kind: Deployment
metadata:
  name: macterm-website-deployment
  labels:
    app: macterm-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: macterm-website
  template:
    metadata:
      labels:
        app: macterm-website
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # See apps/website/manifests/deployment.yaml: soft spreading loses to
          # resource scoring here, and Honor keeps the hard constraint from
          # deadlocking a drain.
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          # Count only pods from the same ReplicaSet. Without this a rolling
          # update ends unbalanced: the outgoing pod still occupies its node
          # when the second new pod is placed, so doubling up looks legal,
          # and the balance is gone once that old pod exits.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: macterm-website
      containers:
        - name: website
          image: ghcr.io/thdxg/macterm/website:20260925-145408-75e2728 # {"$imagepolicy": "macterm:website"}
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
