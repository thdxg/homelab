# The Macterm marketing site and docs (thdxg/macterm, website/). Caddy serving
# a directory of static files that were rendered at image build time — it reads
# nothing, writes nothing, and terminates no TLS, so the pod needs no volumes,
# no config, and no secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macterm-website-deployment
  labels:
    app: macterm-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: macterm-website
  template:
    metadata:
      labels:
        app: macterm-website
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # See apps/website/manifests/deployment.yaml: soft spreading loses to
          # resource scoring here, and Honor keeps the hard constraint from
          # deadlocking a drain.
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          # Count only pods from the same ReplicaSet. Without this a rolling
          # update ends unbalanced: the outgoing pod still occupies its node
          # when the second new pod is placed, so doubling up looks legal,
          # and the balance is gone once that old pod exits.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: macterm-website
      containers:
        - name: website
          # Updated in git by the ImageUpdateAutomation in image.yaml — the
          # marker comment is the setter, so keep it on this line.
          image: ghcr.io/thdxg/macterm/website:20260824-224809-005acfb # {"$imagepolicy": "macterm:website"}
          ports:
            - containerPort: 3000
          # /healthz is served by the image's Caddyfile ahead of any file
          # lookup, so it answers even if the site content were missing.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          # The image already runs as uid 1000 and binds an unprivileged port,
          # so it needs neither capabilities nor escalation. readOnlyRootFilesystem
          # is deliberately NOT set: Caddy's own /data and /config live on the
          # root filesystem, and whether it touches them under `admin off` +
          # `persist_config off` has not been verified against this image. Worth
          # tightening, but only after watching a pod come up with it on.
          securityContext:
            # NET_BIND_SERVICE must be added even though :3000 never needs it.
            # /usr/bin/caddy ships with file capabilities cap_net_bind_service
            # =ep — the *effective* bit is set, and the kernel fails execve()
            # with EPERM whenever a file's effective caps can't actually be
            # granted. drop: ["ALL"] empties the bounding set, so they can't,
            # and every pod died with:
            #   exec /usr/bin/caddy: operation not permitted
            # Adding it back puts it in the bounding set and exec succeeds.
            # (allowPrivilegeEscalation stays false — verified this works;
            # no_new_privs was not the blocker.) The real cleanup is dropping
            # the setcap from the image build, after which this add can go.
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
