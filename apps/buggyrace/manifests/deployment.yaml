apiVersion: apps/v1
kind: Deployment
metadata:
  name: buggyrace-deployment
  labels:
    app: buggyrace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buggyrace
  template:
    metadata:
      labels:
        app: buggyrace
    spec:
      containers:
        - name: website
          image: ghcr.io/thdxg/buggyrace:20260912-235143-2492535 # {"$imagepolicy": "buggyrace:buggyrace"}
          ports:
            - containerPort: 8787
          # Gates endpoint membership during a rolling update: without a probe
          # the new pod joins the Service the moment its container starts,
          # before the server is listening, and requests 502 until it is. No
          # /healthz in this image — / is the served route and returns 200.
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            periodSeconds: 5
