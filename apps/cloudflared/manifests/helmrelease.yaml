apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 5m
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudflared
      version: 2.2.7
      sourceRef:
        kind: HelmRepository
        name: community-charts
  values:
    tunnelConfig:
      name: homelab
    tunnelSecrets:
      existingConfigJsonFileSecret:
        name: cloudflared-config-secret
      existingPemFileSecret:
        name: cloudflared-cert-secret
    ingress:
      # Point directly at the app service while the cilium Gateway's L7
      # redirect is broken (see bootstrap/cilium/values.yaml note) — new
      # connections to the gateway ClusterIP never reach Envoy.
      - hostname: taehoonlee.dev
        service: http://website.website.svc.cluster.local:80
      - hostname: "*.taehoonlee.dev"
        service: http://website.website.svc.cluster.local:80
      - service: http_status:404
    replica:
      count: 2
      allNodes: true
