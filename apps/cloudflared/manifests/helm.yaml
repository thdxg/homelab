apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: community-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://community-charts.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  interval: 5m
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudflared
      version: 2.2.7
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  values:
    tunnelConfig:
      name: homelab
    tunnelSecrets:
      existingConfigJsonFileSecret:
        name: cloudflared-config-secret
      existingPemFileSecret:
        name: cloudflared-cert-secret
    ingress:
      - hostname: taehoonlee.dev
        service: http://cilium-gateway-public-gateway.networking.svc.cluster.local:80
      - hostname: "*.taehoonlee.dev"
        service: http://cilium-gateway-public-gateway.networking.svc.cluster.local:80
      - service: http_status:404
    replica:
      count: 2
      allNodes: true
