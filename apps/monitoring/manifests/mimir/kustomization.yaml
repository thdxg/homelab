apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./statefulset.yaml
  - ./service.yaml
# The generated name carries a content hash, and kustomize rewrites the
# StatefulSet's volume reference to match, so editing mimir.yaml rolls the pod.
configMapGenerator:
  - name: mimir-config
    files:
      - mimir.yaml
