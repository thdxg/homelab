# The collector: a DaemonSet running the pipeline in config.alloy. It reads
# host metrics from each node's /proc, /sys and root filesystem, so it needs
# the hostPath mounts below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    alloy:
      # Generated by the kustomization next to this file. The chart's config
      # reloader sidecar picks up edits without a pod restart.
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      enableReporting: false
      # The remote_write WAL. On the host, so samples buffered while Mimir is
      # down survive a pod restart.
      storagePath: /var/lib/alloy
      extraEnv:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      mounts:
        extra:
          - name: host-proc
            mountPath: /host/proc
            readOnly: true
          - name: host-sys
            mountPath: /host/sys
            readOnly: true
          - name: host-root
            mountPath: /host/root
            readOnly: true
            mountPropagation: HostToContainer
          - name: storage
            mountPath: /var/lib/alloy
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    controller:
      type: daemonset
      # The netdev collector reads /proc/net/dev, and /proc/net is per network
      # namespace: without this the pod only saw its own veth (reported as
      # "eth0") and lo, never the node's eth0/wlan0. Same reason node-exporter
      # runs with hostNetwork. Alloy's :12345 now binds on the node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      volumes:
        extra:
          - name: host-proc
            hostPath:
              path: /proc
          - name: host-sys
            hostPath:
              path: /sys
          - name: host-root
            hostPath:
              path: /
          - name: storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
    # The chart's default namespaced rules include get/list on every Secret
    # and ConfigMap in the cluster. This pipeline only discovers pods (nodes
    # and nodes/metrics come from the default clusterRules).
    rbac:
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
