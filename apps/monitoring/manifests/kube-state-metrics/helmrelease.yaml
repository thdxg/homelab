# Cluster object state as metrics (pod phase, restarts, Deployment replicas,
# PVC status). The Kubernetes dashboards in Grafana depend on it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.5.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # Alloy finds scrape targets by pod annotation (see alloy/config.alloy).
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    # kube_<kind>_labels series are only emitted for kinds listed here. The
    # Kubernetes Views dashboards count objects with them, so allow one cheap
    # label per kind: one series per object, nothing more.
    metricLabelsAllowlist:
      - namespaces=[kubernetes.io/metadata.name]
      - deployments=[app.kubernetes.io/name]
      - statefulsets=[app.kubernetes.io/name]
      - daemonsets=[app.kubernetes.io/name]
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
