# Envoy Gateway v1.4.x targets Gateway API v1.3.0 — the CRD version this
# cluster pins for cilium 1.19 (bootstrap/cilium). Its proxy data plane
# runs as ordinary pods, so it needs none of cilium's L7 proxy steering
# (which is unreliable on this platform — see memory/failure notes).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: v1.4.2
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  values:
    crds:
      # Gateway API CRDs are managed by bootstrap/cilium (pinned v1.3.0).
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
