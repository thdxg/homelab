# Envoy Gateway v1.8.x targets Gateway API v1.5.1 — the CRD version
# pinned in bootstrap/cilium. Its proxy data plane runs as ordinary
# pods, so it needs none of cilium's L7 proxy steering (unreliable on
# this platform — cilium/cilium#47940).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 5m
  chart:
    spec:
      chart: gateway-helm
      version: v1.8.2
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
  values:
    crds:
      # Gateway API CRDs are managed by bootstrap/cilium (pinned v1.3.0).
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
