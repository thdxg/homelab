# Infrastructure settings for the proxy pods EG generates per Gateway of class
# `envoy`, attached via the GatewayClass parametersRef. Never edit the generated
# Deployment directly — EG reconciles it back.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-gateway-proxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # One per node, so a drain always leaves a proxy serving. At one replica
        # a drain took all of *.thdxg.dev down until it rescheduled.
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              # Hard, because soft does not hold: node-1 carries the k3s control
              # plane, so NodeResourcesFit prefers node-2 by more than the spread
              # plugin penalises it, and under ScheduleAnyway a rollout put both
              # replicas on node-2. Honor is what stops a hard constraint from
              # deadlocking a drain — it drops tainted nodes from the domain
              # count, so a cordoned node is no longer an empty domain the
              # evicted pod has to balance against.
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              # Count only pods from the same ReplicaSet. Without this a rolling
              # update ends unbalanced: the outgoing pod still occupies its node
              # when the second new pod is placed, so doubling up looks legal,
              # and the balance is gone once that old pod exits.
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  # Scoped to this Gateway: attached at GatewayClass level, so a
                  # second Gateway would need its own EnvoyProxy.
                  app.kubernetes.io/name: envoy
                  app.kubernetes.io/component: proxy
                  gateway.envoyproxy.io/owning-gateway-namespace: networking
                  gateway.envoyproxy.io/owning-gateway-name: public-gateway
      # Evict the proxies one at a time, waiting for Ready in between.
      envoyPDB:
        minAvailable: 1
