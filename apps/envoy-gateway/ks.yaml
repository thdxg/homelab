apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/envoy-gateway/manifests
  prune: true
  wait: true
  timeout: 5m
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
