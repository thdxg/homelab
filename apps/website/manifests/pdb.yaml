# Makes `kubectl drain` (and so `mise run reboot`) evict the two replicas one
# at a time rather than both at once. With both replicas on the drained node
# the eviction of the second blocks until the first is Ready on the surviving
# node — slower drain, no outage.
#
# minAvailable: 1 only works because replicas is 2. Scaling this Deployment to
# 1 would make every eviction a PDB violation and hang the drain until its
# timeout, aborting the rolling reboot.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: website
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: website
