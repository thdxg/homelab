apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: website
  namespace: flux-system
spec:
  image: ghcr.io/thdxg/website
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: website
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: website
  filterTags:
    pattern: '^\d{8}-\d{6}-[a-f0-9]+'
    extract: "$0"
  policy:
    alphabetical:
      order: asc
