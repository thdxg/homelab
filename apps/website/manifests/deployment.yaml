apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deployment
  namespace: website
  labels:
    app: website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: 20260527-003911-20deca8 # {"$imagepolicy": "flux-system:website:tag"}
          ports:
            - containerPort: 3000
