# Public ingress edge. Wifi/router traffic cannot reach cilium's L7
# (Envoy-backed) service frontends on wlan0 — see cilium/cilium#26584 and
# bootstrap/cilium/values.yaml — but plain L4 hostPort/NodePort to a normal
# pod works fine. This nginx bridges the two: L4 hostPort on the wifi side,
# pod-originated ClusterIP path to the gateway on the cluster side (the
# same path cloudflared uses).
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-config
data:
  nginx.conf: |
    worker_processes 2;
    events {
      worker_connections 1024;
    }
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
      }
      server {
        listen 80;
        location = /edge-healthz {
          return 200;
        }
        location / {
          proxy_pass http://cilium-gateway-public-gateway.networking.svc.cluster.local:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-proxy
spec:
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              hostPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /edge-healthz
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: edge-proxy-config
