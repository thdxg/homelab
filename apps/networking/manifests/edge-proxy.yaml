# Public ingress edge. Wifi/router traffic cannot reach cilium's L7
# (Envoy-backed) service frontends on wlan0 — see cilium/cilium#26584 and
# bootstrap/cilium/values.yaml — but a plain L4 NodePort to a normal pod
# works fine (hostPort does not — its frontends never answer on any
# interface here). This nginx bridges the two: L4 NodePort 30880 on the
# wifi side (router translates WAN:80 → node:30880), pod-originated
# ClusterIP path to the gateway on the cluster side (the same path
# cloudflared uses).
#
# 30880 (not the conventional 30080): traffic to 30080 specifically never
# arrives over the wifi path on this network — every other tested
# NodePort works — so the AP/router appears to filter that port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-config
data:
  nginx.conf: |
    worker_processes 2;
    events {
      worker_connections 1024;
    }
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
      }
      server {
        listen 80;
        location = /edge-healthz {
          return 200;
        }
        location / {
          # Direct to the app service while the cilium Gateway L7 redirect
          # is broken — same bypass as cloudflared's config. Swap back to
          # cilium-gateway-public-gateway.networking.svc.cluster.local
          # once the gateway works again.
          proxy_pass http://website.website.svc.cluster.local:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-proxy
spec:
  selector:
    matchLabels:
      app: edge-proxy
  template:
    metadata:
      labels:
        app: edge-proxy
    spec:
      # Host network: nginx binds :80 as a plain host socket, so the
      # router can forward WAN:80 → node:80 without port translation
      # (the router only supports single-port forward rules). Plain host
      # sockets are the proven-working class over wlan0.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /edge-healthz
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: edge-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-proxy
spec:
  type: NodePort
  selector:
    app: edge-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30880
