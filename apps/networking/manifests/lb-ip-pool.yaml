apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-gateway-pool
spec:
  # Single LAN address for the public gateway. Must stay outside the
  # router's DHCP pool so it can't be handed to another device.
  blocks:
    - start: 10.0.0.240
      stop: 10.0.0.240
  serviceSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: public-gateway
